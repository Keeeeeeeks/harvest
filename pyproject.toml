[project]
name = "harvest-decomp"
version = "0.1.0"
description = "Tooling for the Harvest: Massive Encounter matching decompilation"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pyelftools>=0.33",
]

[project.scripts]
hv = "hv.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.12"]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "hv"
module-root = "tools"

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "originals: needs the pinned original binaries under orig/ (skipped when absent)",
    "toolchain: compiles with Docker when HARVEST_TEST_TOOLCHAIN=1",
]

[tool.ruff.lint.isort]
known-first-party = ["hv"]
